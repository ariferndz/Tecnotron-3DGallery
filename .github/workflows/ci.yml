# En cada cambio: regenera el plugin, comprueba que el zip subido está al día
# y prueba el catálogo completo en un WordPress real (Docker) con Chromium.
# Al subir una etiqueta v1.2.3 publica una versión (Release) con el zip adjunto.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin (zip y comprobaciones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerar dist/tecnotron-maquinas.zip
        run: npm run build
      - name: El zip del repositorio está al día
        run: |
          if ! git diff --quiet -- dist tecnotron-maquinas; then
            git status --short
            echo "::error::El zip o assets/vendor no coinciden con el código: ejecuta «npm run build» y sube los cambios."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tecnotron-maquinas
          path: dist/tecnotron-maquinas.zip

  e2e:
    name: Pruebas en WordPress
    runs-on: ubuntu-latest
    needs: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Arrancar WordPress y MariaDB
        run: |
          docker compose up -d --wait
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            if [ "$code" = 200 ] || [ "$code" = 302 ]; then break; fi
            sleep 2
          done
      - name: Cargar el catálogo de demostración
        run: npm run dev:datos
      - name: Pruebas de la web y del escritorio
        run: npm test
      - name: Registro de WordPress
        if: failure()
        run: docker compose logs wordpress | tail -n 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: tests/capturas

  release:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/tecnotron-maquinas.zip
          generate_release_notes: true
